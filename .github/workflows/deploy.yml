name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Lists open "[NEED DETAIL]" items in the log. It never fails the build.
      - name: Open items
        run: npm run check:placeholders || true

      - run: npm run check
      - run: npm run build
        env:
          # astro.config.mjs derives the site address and base path from GITHUB_REPOSITORY.
          # Uncomment these to override (custom domain, or a different path):
          # SITE_URL: https://example.com
          # BASE_PATH: /
          CI: "true"

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
