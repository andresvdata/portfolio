# Career map pins.
#
# kind: base = a place where I lived, worked or studied.
# kind: data = a place the DATA of a remote project comes from. I was not based there.
#
# Entry layers: work, education, projects (shown as "Remote projects" in the interface).
# An entry with a `title` also appears in the remote-projects strip under the map.
# `project` is a case-study id, or "more:<id>" to jump to a row in the smaller-projects list.
# arcs: lines drawn from this pin. kind "move" = I relocated. kind "remote" = built remotely from here.
# Coordinates are city-level only.
#
# HOW TO EDIT
# - Add a place: copy a block below, give it a new `id`, `label`, `lon`, `lat` (city level) and entries.
# - Hide a place or a single entry without deleting it: add `hidden: true`.
# - Layers (Work, Study, Remote projects), lines, the legend and the "Built remotely" list are switched on
#   or off in src/config/map.ts.

- id: vancouver
  kind: base
  label: Vancouver, Canada
  lon: -123.12
  lat: 49.28
  arcs:
    - to: florida
      kind: remote
  entries:
    - layer: education
      text: "Langara College · Post-Degree Diploma in Data Analytics · 2022 – 2023"
    - layer: work
      text: "Langara College · Student Aide, then Research Assistant (Data Analyst) · 2022 – 2025"
    - layer: projects
      title: CORD-19 text mining
      text: "Remote Kaggle challenge on COVID-19 research articles (2023), using a public dataset."
      project: "more:cord19"
    - layer: projects
      title: Exploratory analyses in R and Python
      text: "Remote analyses of public datasets, including Langara coursework (2022 – 2023)."
      project: "more:eda-r"
    - layer: work
      text: "BC SPCA · Business Intelligence Developer · Sep 2025 – present"
  source: "RES · Work history, Education and Professional Development; LI · Experience; GH · CORD-19 and EDA repositories; user statement that these projects were built remotely"

