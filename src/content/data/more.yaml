- id: report-generation
  topics: [pipelines, reporting]
  order: 1
  title: Automated report generation web app
  type: professional
  period: Dec 2024
  blurb: >-
    A team project: a web app where users enter a few inputs and download a formatted Excel report built from live
    data. Further details are confidential.
  details:
    - Connected to the Apache Pinot OLAP store through its Python client and wrote SQL queries for the metrics and trends the reports needed.
