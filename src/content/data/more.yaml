- id: anomaly
  topics: [analysis]
  order: 8
  title: Detection of illicit activities (anomaly detection)
  type: professional
  period: Jul 2022
  blurb: >-
    Flagged atypical values in commercial and transport data that could point to illicit activity, following
    CRISP-DM. Further details are confidential.
  details:
    - Split the business rules into two groups. Statistical rules are sensitive to trend and seasonality; classification rules describe conditions that can be identified exactly.
    - For the statistical group, compared ARIMA and Prophet, and chose Prophet for its flexibility and fit when outliers are present.
    - Flagged values in two passes, first within groups of similar values and then against each series' own seasonality and history, using an uncertainty range tuned beforehand.
    - Combined the outliers from both groups in one database for a visual report, and automated the process once the models were validated.
    - 'Tools: SQL Server Management Studio, Jupyter, Git and Azure DevOps; Python with pandas, NumPy, scikit-learn and Prophet.'
  tags: [Python, SQL, Forecasting & ML]
  source: "OLD · Detection of illicit activities page"

- id: shortage
  topics: [analysis]
  order: 9
  title: Probability of product shortage (Monte Carlo)
  type: professional
  period: Aug 2021
  blurb: >-
    Estimated the probability of low ending inventory, following CRISP-DM.
  details:
    - Identified the data that could answer the business questions, then built empirical cumulative distributions of the variables.
    - Built an interpolation function for the Monte Carlo simulations, which preserve the correlations seen in the historical data.
    - Turned the simulated values into the probability that ending inventory runs low.
    - Automated the process once the model was validated.
    - 'Tools: SQL Server Management Studio, Jupyter, Git and Azure DevOps; Python with pandas, NumPy, SciPy and statsmodels.'
  tags: [Python, SQL, Forecasting & ML]
  source: "OLD · Shortage of a product page"
