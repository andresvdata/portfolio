# Skills by role: the table on the home page.
#
# HOW TO EDIT
# - Rows appear in this file's order, grouped by `group` (a new group name creates a new section).
# - `roles` maps a column id (see skill-columns.yaml) to the evidence shown when someone taps the dot.
#   Only add a column where you can point to real work. No entry = no dot.
# - `topics` (1 to 4) connects the row to the recruiter filter: reporting | modeling | pipelines |
#   analysis | cloud | practice | research.
# - `source` says where the claim comes from (RES resume, LI LinkedIn, GH repository, ASK confirmed by you).
# - `hidden: true` keeps a row in the file without showing it.
#
# Template (copy, paste, edit):
#
# - id: my-skill
#   group: Integration & pipelines
#   label: My skill
#   topics: [pipelines]
#   roles:
#     bcspca: "What I did with it there"
#   source: "ASK · Andres, 2026-11-13"

